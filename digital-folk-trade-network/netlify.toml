[build]
  base = "digital-folk-trade-network"
  command = "rm -f pnpm-lock.yaml && npm install --legacy-peer-deps && npx prisma generate && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Force npm usage and disable pnpm
  NETLIFY_USE_YARN = "false"
  NETLIFY_USE_PNPM = "false"
  NPM_CONFIG_PACKAGE_LOCK = "true"

# Functions configuration for API routes
[functions]
  node_bundler = "esbuild"

# Redirect rules (handled by Next.js)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
